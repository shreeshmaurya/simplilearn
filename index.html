<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snacks Point by Shreesh - Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <div class="container-fluid vh-100">
    <div class="row h-100">
      <!-- Left Column - Login Form -->
      <div class="col-md-6 d-flex align-items-center justify-content-center login-form-section">
        <div class="login-form-wrapper">
          <div class="text-center mb-4">
            <h1 class="brand-logo">Snacks Point by Shreesh</h1>
            <p class="text-muted">Admin Login</p>
          </div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">
                <i class="fas fa-envelope me-2"></i>Email Address
              </label>
              <input type="email" class="form-control form-control-lg" id="email" placeholder="Enter your email" required>
              <div class="invalid-feedback" id="emailError">Please enter a valid email address.</div>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">
                <i class="fas fa-lock me-2"></i>Password
              </label>
              <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password" required>
              <div class="invalid-feedback" id="passwordError">Please enter your password.</div>
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg login-btn">
                <i class="fas fa-sign-in-alt me-2"></i>Login
              </button>
              <button type="button" class="btn btn-outline-secondary btn-lg reset-btn" id="resetBtn">
                <i class="fas fa-redo me-2"></i>Reset
              </button>
            </div>
          </form>
          <div class="text-center mt-4">
            <small class="text-muted">Demo: admin@gmail.com / admin123</small>
          </div>
        </div>
      </div>
      <!-- Right Column - Hero Image -->
      <div class="col-md-6 d-none d-md-flex login-hero-section">
        <div class="hero-overlay">
          <h2>Welcome to</h2>
          <h1 class="brand-logo-hero">Snacks Point by Shreesh</h1>
          <p>Discover the best food & drinks in town</p>
          <div class="hero-features">
            <span><i class="fas fa-check-circle"></i> Fresh Food</span>
            <span><i class="fas fa-check-circle"></i> Fast Delivery</span>
            <span><i class="fas fa-check-circle"></i> Best Prices</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
